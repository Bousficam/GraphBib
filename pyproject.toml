[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbib"
version = "0.1.0"
description = "Organize your bibliography as a knowledge graph for Obsidian"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pdfplumber>=0.10",
    "bibtexparser>=1.4,<2.0",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "numpy>=1.24",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "streamlit>=1.32",
    "pandas>=2.0",
]

[project.scripts]
graphbib = "graphbib.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphbib*"]
