# GraphBib — clusters_template.yaml
# ─────────────────────────────────────────────────────────────
# ÉTAPE 2 : éditez ce fichier, puis lancez :
#   graphbib build --clusters clusters_template.yaml --out ./vault
# ─────────────────────────────────────────────────────────────

# ── Clusters pré-définis (top-down) ──────────────────────────
# Renommez 'Cluster_N', ajoutez/supprimez des seed_keywords.
predefined_clusters:
  - name: "Cluster_1"  # ← renommez
    seed_keywords: ["bci", "mi", "brain computer", "mi bci"]
    color: "#6366f1"
    # 89 doc(s) contiennent le keyword "bci"

  - name: "Cluster_2"  # ← renommez
    seed_keywords: ["mi", "bci", "mi bci", "imagery"]
    color: "#f59e0b"
    # 68 doc(s) contiennent le keyword "mi"

  - name: "Cluster_3"  # ← renommez
    seed_keywords: ["cid cid", "cid", "nodes", "ij"]
    color: "#10b981"
    # 65 doc(s) contiennent le keyword "cid cid"

  - name: "Cluster_4"  # ← renommez
    seed_keywords: ["cid", "cid cid", "imagery", "nodes"]
    color: "#ef4444"
    # 56 doc(s) contiennent le keyword "cid"

  - name: "Cluster_5"  # ← renommez
    seed_keywords: ["rtms", "tms", "frequency rtms", "repetitive transcranial"]
    color: "#3b82f6"
    # 54 doc(s) contiennent le keyword "rtms"

  - name: "Cluster_6"  # ← renommez
    seed_keywords: ["imagery", "motor imagery", "imagined", "mi"]
    color: "#8b5cf6"
    # 53 doc(s) contiennent le keyword "imagery"

  - name: "Cluster_7"  # ← renommez
    seed_keywords: ["single case", "designs", "sced", "randomization"]
    color: "#ec4899"
    # 48 doc(s) contiennent le keyword "single case"

  - name: "Cluster_8"  # ← renommez
    seed_keywords: ["tms", "rtms", "coil", "pulse"]
    color: "#14b8a6"
    # 42 doc(s) contiennent le keyword "tms"


# ── Keywords à rejeter (bruit, artefacts PDF) ────────────────
# Ajoutez ici les tokens non pertinents détectés dans le rapport.
reject_keywords:
  - []  # remplacez par vos tokens bruit


# ── Synonymes à fusionner ────────────────────────────────────
synonyms:
  # "terme_canonique": ["alias1", "alias2"]
  # "neural network": ["neural net", "deep learning"]


# ── Découverte automatique de nouveaux clusters ───────────────
# Activez pour laisser l'algo trouver des groupes non anticipés.
discovery:
  enabled: true
  algorithm: hdbscan   # hdbscan | kmeans
  min_cluster_size: 3  # nb minimum de documents par cluster
  embedding: tfidf     # tfidf | keybert (nécessite sentence-transformers)
